model:
  vocab_size: 2000
  image_size: 224
  patch_size: 16
  vision_dim: 256
  vision_depth: 6
  vision_heads: 4
  vision_ffn: 512
  vision_dropout: 0.1
  grid_size: 14
  qformer_queries: 96
  qformer_dim: 384
  qformer_depth: 3
  qformer_heads: 6
  qformer_ffn: 1024
  qformer_dropout: 0.1
  decoder_dim: 384
  decoder_depth: 8
  decoder_heads: 6
  decoder_ffn: 1536
  decoder_dropout: 0.1
  max_seq_len: 256

tokenizer:
  vocab_size: 2000
  max_bpe_merges: 1996

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.999
  patience: 10
  lambda_order: 0.1
  use_amp: true
  amp_dtype: "bfloat16"

data:
  data_dir: "data/synthetic_data"
  num_easy: 300
  num_medium: 300
  num_hard: 300
  num_document: 300
  val_split: 0.1
  test_split: 0.1

logging:
  log_interval: 50
  eval_interval: 5
  save_interval: 5
  checkpoint_dir: "checkpoints"
